<!DOCTYPE html>
<html>
<head>
    <title>Docker Compose Demo</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        #data { color: blue; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Frontend served by NGINX</h1>
    <p>Message from API: <span id="data">Loading...</span></p>

    <script>
        // The browser is outside Docker, so use the host-mapped port (5000),
        // not the container port (5001).
        fetch('http://localhost:5000/api/health')
            .then(response => response.json())
            .then(data => {
                document.getElementById('data').innerText = data.message;
            })
            .catch(err => {
                document.getElementById('data').innerText = "Could not connect to API";
                console.error(err);
            });
    </script>
</body>
</html>
